<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#a8462a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tablekeeper">
<title>{{TITLE}} - Tablekeeper</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js" defer></script>
</head>
<body data-screen="{{SCREEN}}">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/" aria-label="Tablekeeper home">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="15" fill="currentColor"/>
        <path d="M9 13.5h14M11 13.5v8M21 13.5v8M16 9.5v4" fill="none" stroke="#fbf7f0" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand__name">Tablekeeper</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a class="site-nav__link" href="/" data-nav="search">Search</a>
      <a class="site-nav__link" href="/lookup" data-nav="lookup">Look up</a>
    </nav>
    <div class="account" id="account">
      <a class="site-nav__link" href="/login" data-nav="login">Sign in</a>
      <a class="button button--small" href="/signup" data-nav="signup">Sign up</a>
    </div>
  </div>
</header>
<main id="main" class="page" tabindex="-1">
{{CONTENT}}
</main>
<footer class="site-footer">
  <p>Tablekeeper &middot; Book a table in a few taps. Times are shown in each restaurant's local time.</p>
</footer>
</body>
</html>
